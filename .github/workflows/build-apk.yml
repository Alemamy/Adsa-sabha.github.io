name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          cache: true
      - name: Extract production project
        run: |
          rm -rf build-src
          mkdir -p build-src
          unzip -q adsa_sabha_production_ready.zip -d build-src
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build-src" -name pubspec.yaml -type f -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Repair Flutter and Android build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > lib/app_theme.dart <<'EOF'
          import 'package:flutter/material.dart';
          class AppTheme {
            static const bg = Color(0xFF050505);
            static const surface = Color(0xFF101419);
            static const surface2 = Color(0xFF171C22);
            static const gold = Color(0xFFFFC928);
            static const white = Color(0xFFF6F6F6);
            static const muted = Color(0xFF9AA3AD);
            static ThemeData get theme => ThemeData(
              brightness: Brightness.dark,
              scaffoldBackgroundColor: bg,
              colorScheme: ColorScheme.fromSeed(seedColor: gold, brightness: Brightness.dark),
              fontFamily: 'Arial',
              useMaterial3: true,
            );
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/screens.dart')
          s=p.read_text(encoding='utf-8')
          if "import 'app_theme.dart';" not in s:
              s=s.replace("import 'app_config.dart';","import 'app_config.dart';\nimport 'app_theme.dart';")
          if "import 'dart:ui' as ui;" not in s:
              s="import 'dart:ui' as ui;\n"+s
          s=s.replace("TextDirection.rtl","ui.TextDirection.rtl")
          s=s.replace("...ads.map((ad) => AdCard(ad: ad)),","...ads.map((ad) => AdCard(ad: ad, db: widget.db, profile: widget.profile)),")
          s=s.replace("...(s.data ?? const <AdItem>[]).map((a) => AdCard(ad: a)),","...(s.data ?? const <AdItem>[]).map((a) => AdCard(ad: a, db: widget.db, profile: widget.profile)),")
          old="class AdCard extends StatelessWidget {\n  final AdItem ad;\n  const AdCard({super.key, required this.ad});"
          new="class AdCard extends StatelessWidget {\n  final AdItem ad;\n  final FirestoreService db;\n  final UserProfile profile;\n  const AdCard({super.key, required this.ad, required this.db, required this.profile});"
          if old in s: s=s.replace(old,new)
          s=s.replace("AdDetailsScreen(ad: ad, db: widget.db, profile: widget.profile)","AdDetailsScreen(ad: ad, db: db, profile: profile)")
          p.write_text(s,encoding='utf-8')
          PY
          # Update Android Gradle and Kotlin plugins to versions required by dependencies.
          find android -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | xargs -0 sed -i 's/com\.android\.tools\.build:gradle:8\.7\.3/com.android.tools.build:gradle:8.9.1/g; s/com\.android\.application:8\.7\.3/com.android.application:8.9.1/g; s/com\.android\.library:8\.7\.3/com.android.library:8.9.1/g; s/org\.jetbrains\.kotlin\.android" version "2\.1\.0/org.jetbrains.kotlin.android" version "2.3.0/g; s/ext\.kotlin_version = .2\.1\.0./ext.kotlin_version = "2.3.0"/g'
          if [ -f android/settings.gradle ]; then
            sed -i 's/com.android.application" version "8\.7\.3/com.android.application" version "8.9.1/g; s/com.android.library" version "8\.7\.3/com.android.library" version "8.9.1/g; s/org.jetbrains.kotlin.android" version "2\.1\.0/org.jetbrains.kotlin.android" version "2.3.0/g' android/settings.gradle
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then sed -i 's/gradle-8\.9-all\.zip/gradle-8.11-all.zip/g; s/gradle-8\.9-bin\.zip/gradle-8.11-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties; fi
          # Align Java compilation with Kotlin JVM target 17.
          find android -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print0 | xargs -0 sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g; s/JavaVersion\.VERSION_8/JavaVersion.VERSION_17/g; s/jvmTarget = "1\.8"/jvmTarget = "17"/g; s/jvmTarget = '\''1\.8'\''/jvmTarget = '\''17'\''/g'
          # Replace corrupt placeholder launcher PNGs with valid PNG files at each density.
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          def png(w,h):
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              raw=b''.join(b'\x00'+bytes([255,201,40,255])*w for _ in range(h))
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw))+chunk(b'IEND',b'')
          for density,size in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
              p=Path('android/app/src/main/res')/density/'ic_launcher.png'
              if p.exists():
                  p.write_bytes(png(size,size))
          PY
          echo "Android build configuration:"
          grep -R "8\.9\.1\|2\.3\.0\|gradle-8\.11" -n android/settings.gradle android/build.gradle android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get
      - name: Upload extracted source for repair
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adsa-sabha-extracted-source
          path: |
            build-src/**/lib/
            build-src/**/pubspec.yaml
            build-src/**/android/
          if-no-files-found: error
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adsa-sabha-release-apk
          path: build-src/**/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
